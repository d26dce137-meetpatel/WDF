<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="container">

<div class="left">

<h2>Forgot Password</h2>

<form>

<div class="input-box">
<label>Email</label>
<input type="email" id="email" placeholder="Enter Email" required>
</div>

<div class="input-box">
<label>Enrollment Number</label>
<input type="text" id="enrollment" placeholder="Enter Enrollment Number" required>
</div>

<button type="button" class="verify-btn" onclick="verifyUser()">Verify</button>

<div id="passwordSection">

<div class="input-box">
<label>New Password</label>
<input type="password" id="newPassword" placeholder="Enter New Password">
</div>

<div class="input-box">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm Password">
</div>

<button type="button" class="update-btn" onclick="updatePassword()">Update Password</button>

</div>

<div class="back">
<a href="login.html">← Back to Login</a>
</div>

</form>

</div>

<div class="right">

<img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" alt="Forgot Password">

<h1>Password Recovery</h1>

<p>
Verify your Email and Enrollment Number.<br>
After verification, create a new password<br>
and login again.
</p>

</div>

</div>

<script>

function verifyUser() {

let email = document.getElementById("email").value.trim();
let enrollment = document.getElementById("enrollment").value.trim();

let student = JSON.parse(localStorage.getItem("student"));

if (student == null) {
alert("Please Create Account First!");
window.location.href = "create_account.html";
return;
}

if (email === student.email && enrollment === student.enrollment) {
alert("Verification Successful!");
document.getElementById("passwordSection").style.display = "block";
} else {
alert("Invalid Email or Enrollment Number!");
}

}

function updatePassword() {

let newPassword = document.getElementById("newPassword").value;
let confirmPassword = document.getElementById("confirmPassword").value;

if (newPassword == "" || confirmPassword == "") {
alert("Please Enter Both Passwords");
return;
}

if (newPassword !== confirmPassword) {
alert("Passwords Do Not Match");
return;
}

let student = JSON.parse(localStorage.getItem("student"));

student.password = newPassword;

localStorage.setItem("student", JSON.stringify(student));

alert("Password Updated Successfully!");

window.location.href = "login.html";

}

</script>

</body>
</html>
