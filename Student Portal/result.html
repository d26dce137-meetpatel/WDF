<div class="title">

<h2>Student Result</h2>

</div>




<div class="main">



<div class="left">


<h3>Search Result</h3>



<select id="course">

<option>Select Course</option>

<option>Computer Engineering</option>

</select>



<input type="text" id="enroll" placeholder="Enrollment Number">



<input type="password" id="pass" placeholder="Password">



<button onclick="showResult()">Search</button>



</div>






<div class="right">



<table id="resultTable">


<thead>

<tr>

<th>Subject Code</th>
<th>Subject Name</th>
<th>Internal</th>
<th>External</th>
<th>Total</th>
<th>Result</th>

</tr>

</thead>



<tbody id="resultData">


</tbody>


</table>





<div class="summary" id="summary">



<div>

<label>Total Grade</label>

<input type="text" value="A+" readonly>

</div>



<div>

<label>SPI</label>

<input type="text" value="9.18" readonly>

</div>



<div>

<label>Result</label>

<input type="text" value="PASS" readonly>

</div>



</div>




</div>



</div>






<div class="footer">

© 2026 Student Hub | All Rights Reserved

</div>



</div>







<script>


document.getElementById("summary").style.display="none";



function showResult(){


let course = document.getElementById("course").value;

let enroll = document.getElementById("enroll").value.trim();

let pass = document.getElementById("pass").value.trim();



let student = JSON.parse(localStorage.getItem("student"));





if(course=="Select Course" || enroll=="" || pass==""){


document.getElementById("resultData").innerHTML=`

<tr>

<td colspan="6">

<h3>Record Not Found</h3>

</td>

</tr>

`;


document.getElementById("summary").style.display="none";


return;


}






if(student && enroll==student.enrollment && pass==student.password){



document.getElementById("resultData").innerHTML=`


<tr>

<td>4351601</td>

<td>Web Technology</td>

<td>28</td>

<td>60</td>

<td>88</td>

<td>PASS</td>

</tr>



<tr>

<td>4351602</td>

<td>Computer Network</td>

<td>27</td>

<td>59</td>

<td>86</td>

<td>PASS</td>

</tr>




<tr>

<td>4351603</td>

<td>Java Programming</td>

<td>29</td>

<td>61</td>

<td>90</td>

<td>PASS</td>

</tr>




<tr>

<td>4351604</td>

<td>FDSA</td>

<td>26</td>

<td>57</td>

<td>83</td>

<td>PASS</td>

</tr>




<tr>

<td>4351605</td>

<td>Machine Learning</td>

<td>30</td>

<td>64</td>

<td>94</td>

<td>PASS</td>

</tr>


`;



document.getElementById("summary").style.display="flex";



}

else{


document.getElementById("resultData").innerHTML=`

<tr>

<td colspan="6">

<h3>Record Not Found</h3>

</td>

</tr>

`;



document.getElementById("summary").style.display="none";

}



}



</script>



</body>

</html>
