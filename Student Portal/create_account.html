<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="container">

<div class="left">

<h2>Create Account</h2>

<form id="createForm">

<div class="input-box">
<label>Name</label>
<input type="text" id="name" placeholder="Enter Name">
</div>

<div class="input-box">
<label>Enrollment Number</label>
<input type="text" id="enrollment" placeholder="Enter Enrollment Number">
</div>

<div class="input-box">
<label>Mobile Number</label>
<input type="tel" id="mobile" placeholder="Enter Mobile Number">
</div>

<div class="input-box">
<label>Email</label>
<input type="email" id="email" placeholder="Enter Email">
</div>

<div class="input-box">
<label>Create Password</label>
<input type="password" id="password" placeholder="Create Password">
</div>

<div class="input-box">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm Password">
</div>

<div class="checkbox">
<input type="checkbox" id="terms">
<label for="terms">I Agree to Terms & Conditions</label>
</div>

<button type="submit">Create Account</button>

<div class="login">
Already have an account?
<a href="login.html">Login</a>
</div>

</form>

</div>

<div class="right">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135789.png">

<h1>Join Student Hub</h1>

<p>
Create your account to access<br>
Courses, Attendance,<br>
Results, Assignments<br>
and much more.
</p>

</div>

</div>

<script>
document.getElementById("createForm").addEventListener("submit", function(e) {

e.preventDefault();

let name = document.getElementById("name").value.trim();
let enrollment = document.getElementById("enrollment").value.trim();
let mobile = document.getElementById("mobile").value.trim();
let email = document.getElementById("email").value.trim();
let password = document.getElementById("password").value;
let confirmPassword = document.getElementById("confirmPassword").value;
let terms = document.getElementById("terms").checked;

if (name == "" || enrollment == "" || mobile == "" || email == "" || password == "" || confirmPassword == "") {
alert("Please Fill All Fields");
return;
}

if (password != confirmPassword) {
alert("Password and Confirm Password Do Not Match");
return;
}

if (!terms) {
alert("Please Accept Terms & Conditions");
return;
}

let oldStudent = JSON.parse(localStorage.getItem("student"));

if (oldStudent != null && oldStudent.email === email) {
alert("Email Already Registered");
return;
}

let student = {
name: name,
enrollment: enrollment,
mobile: mobile,
email: email,
password: password
};

localStorage.setItem("student", JSON.stringify(student));

alert("Account Created Successfully!");

window.location.href = "login.html";

});
</script>

</body>
</html>
