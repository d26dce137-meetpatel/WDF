<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Hub Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="container">

<div class="left">

<h1>Student Hub</h1>
<p>Welcome Back! Login to Continue</p>

<form id="loginForm">

<div class="input-box">
<label>Email</label>
<input type="email" id="email" placeholdaer="Enter Email" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" id="password" placeholder="Enter Password" required>
</div>

<div class="forgot">
<a href="forgot_password.html">Forgot Password?</a>
</div>

<button type="submit">Login</button>

<div class="signup">
Don't have an account?
<a href="create_account.html">Create Account</a>
</div>

</form>

</div>

<div class="right">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Student Hub">

<h2>Welcome to<br>Student Hub</h2>

<p>
Manage Attendance<br>
View Courses<br>
Check Results<br>
Stay Connected
</p>

</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e) {

e.preventDefault();

let email = document.getElementById("email").value.trim();
let password = document.getElementById("password").value.trim();

let student = JSON.parse(localStorage.getItem("student"));

if (student == null) {
alert("Please Create Account First!");
window.location.href = "create_account.html";
return;
}

if (email === student.email && password === student.password) {

localStorage.setItem("isLoggedIn", "true");

alert("Login Successful!");

window.location.href = "dashboard.html";

} else {

alert("Invalid Email or Password!");

}

});

</script>

</body>
</html>
