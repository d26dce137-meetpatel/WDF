<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="create_account.css">
</head>

<body>

<div class="container">

<div class="box">

<div class="left">

<h1>Create Account</h1>
<p>Join Student Hub Portal</p>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter Name">

<label>Enrollment Number</label>
<input type="text" placeholder="Enter Enrollment Number">

<label>Mobile Number</label>
<input type="tel" placeholder="Enter Mobile Number">

<label>Email</label>
<input type="email" placeholder="Enter Email">

<label>Password</label>
<input type="password" placeholder="Create Password">

<label>Confirm Password</label>
<input type="password" placeholder="Confirm Password">

<div class="check">
<input type="checkbox">
<span>I Agree to Terms & Conditions</span>
</div>

<button type="submit">
Create Account
</button>

<div class="login">
Already have an account?
<a href="login.html">Login</a>
</div>

</form>

</div>

<div class="right">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135789.png">

<h2>Join Student Hub</h2>

<p>
Create your account to access<br>
Courses, Attendance,<br>
Assignments and Study Material.
</p>

</div>

</div>

</div>

</body>
</html>
