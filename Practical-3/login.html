<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Hub Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="container">

<div class="login-box">

<div class="left">

<h1>Student Hub</h1>

<p>Welcome Back! Login to Continue</p>

<form>

<label>Email</label>
<input type="email" placeholder="Enter Email">

<label>Password</label>
<input type="password" placeholder="Enter Password">

<a href="forgot_password.html" class="forgot">
Forgot Password?
</a>

<button type="submit">
Login
</button>

<div class="signup">
Don't have an account?
<a href="create_account.html">Create Account</a>
</div>

</form>

</div>

<div class="right">

<img src="../images.png">

<h2>
Welcome to<br>
Student Hub
</h2>

<p>
Manage Attendance<br>
View Courses<br>
Check Assignments<br>
Stay Connected
</p>

</div>

</div>

</div>

</body>
</html>
