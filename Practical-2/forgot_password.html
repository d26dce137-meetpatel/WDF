<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
</head>

<body>

<h2>Forgot Password</h2>

<p>Password Recovery</p>

<img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" alt="Password Recovery" width="120">

<h3>Password Recovery</h3>

<p>
Verify your account details and create a new password to login again.
</p>

<form>

<label>Email</label><br>
<input type="email" placeholder="Enter Email">

<br><br>

<label>Enrollment Number</label><br>
<input type="text" placeholder="Enter Enrollment Number">

<br><br>

<button type="button">Verify</button>

<br><br>

<label>New Password</label><br>
<input type="password" placeholder="Enter New Password">

<br><br>

<label>Confirm Password</label><br>
<input type="password" placeholder="Confirm Password">

<br><br>

<button type="submit">Update Password</button>

</form>

<p>
<a href="login.html">← Back to Login</a>
</p>

</body>
</html>
