<main>

    <h2>Create Account</h2>

    <p>Create your Student Portal account.</p>

    <h3>Account Information</h3>

    <form>

        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <label for="mobile">Mobile No:</label><br>
        <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" required><br><br>

        <label for="enrollment">Enrollment No:</label><br>
        <input type="text" id="enrollment" name="enrollment" placeholder="Enter enrollment number" required><br><br>

        <label for="password">Create Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Create password" required><br><br>

        <label for="confirm">Confirm Password:</label><br>
        <input type="password" id="confirm" name="confirm" placeholder="Confirm password" required><br><br>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the Terms and Conditions.</label><br><br>

        <button type="submit">Create Account</button>
        <button type="reset">Clear</button>

    </form>

    <p>
        Already have an account?
        <a href="login.html">Login Here</a>
    </p>

</main>
