<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
</head>

<body>

<h1>Create Account</h1>

<p>Join Student Hub Portal</p>

<img src="../images.png" alt="Student Hub Logo" width="100">

<h2>Join Student Hub</h2>

<p>
Create your account to access
Courses, Attendance,
Assignments and Study Material.
</p>

<form>

<label>Full Name</label><br>
<input type="text" placeholder="Enter Name">

<br><br>

<label>Enrollment Number</label><br>
<input type="text" placeholder="Enter Enrollment Number">

<br><br>

<label>Mobile Number</label><br>
<input type="tel" placeholder="Enter Mobile Number">

<br><br>

<label>Email</label><br>
<input type="email" placeholder="Enter Email">

<br><br>

<label>Password</label><br>
<input type="password" placeholder="Create Password">

<br><br>

<label>Confirm Password</label><br>
<input type="password" placeholder="Confirm Password">

<br><br>

<input type="checkbox">
<label>I Agree to Terms & Conditions</label>

<br><br>

<button type="submit">Create Account</button>

</form>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</body>
</html>
