<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Create Account</title>
    <link rel="stylesheet" href="createaccount.css">
    <link rel="stylesheet" href="dark-theme.css">
</head>
<body>

<header>
    <div class="header-top">
        <h1>Student Portal</h1>
        
        <div class="header-controls">

            <button type="button" id="hamburgerBtn" class="hamburger-btn" aria-label="Toggle Menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>


            <button type="button" id="themeToggleBtn" class="theme-btn">🌙 Dark Mode</button>
        </div>
    </div>

    <nav id="navMenu">
        <a href="home.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="updateprofile.html">Update Profile</a>
        <a href="about.html">About Us</a>
        <a href="createaccount.html">Create Account</a>
        <a href="forgotpassword.html">Forgot Password</a>
        <a href="contact.html">Contact Us</a>
        <a href="events.html">Events</a>
        <a href="feedback.html">Feedback</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main>
    <section class="account-title">
        <h2>Create Account</h2>
        <p>Create your Student Portal account.</p>
    </section>

    <section class="account">
        <h3>Account Information</h3>

        <form id="registerForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="mobile">Mobile No:</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" required>

            <label for="enrollment">Enrollment No:</label>
            <input type="text" id="enrollment" name="enrollment" placeholder="Enter enrollment number" required>

            <label for="password">Create Password:</label>
            <input type="password" id="password" name="password" placeholder="Create password" required>

            <label for="confirm">Confirm Password:</label>
            <input type="password" id="confirm" name="confirm" placeholder="Confirm password" required>

            <div class="terms">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the Terms and Conditions.</label>
            </div>

            <button type="submit" class="btn-action">Create Account</button>
            <button type="reset" class="btn-reset">Clear</button>
        </form>

        <p>
            Already have an account?
            <a href="login.html">Login Here</a>
        </p>
    </section>

    <div id="accountModal" class="modal-overlay">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; color: #2a9d8f;">Campus Announcement</h3>
                <button type="button" id="closeAccountModalBtn" class="modal-close-btn">&times;</button>
            </div>
            
            <p id="modalStudentDetails" style="margin: 15px 0; line-height: 1.6;">
            </p>

            <button type="button" id="confirmAccountModalBtn" style="background: #2a9d8f; color: white; border: none; padding: 10px 22px; border-radius: 20px; cursor: pointer; font-weight: bold;">Understood</button>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 Student Portal. All Rights Reserved.</p>
</footer>

<script src="main.js"></script>
</body>
</html>
