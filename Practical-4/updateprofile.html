<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="updateprofile.css">
     <link rel="stylesheet" href="dark-theme.css">

</head>

<body>
<header>
    <div class="header-top">
        <h1>Student Portal</h1>
        
        <div class="header-controls">

            <button type="button" id="themeToggleBtn" class="theme-btn">🌙 Dark Mode</button>
            

            <button type="button" id="hamburgerBtn" class="hamburger-btn">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </div>

    <nav id="navMenu">
        <a href="home.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="updateprofile.html">Update Profile</a>
        <a href="about.html">About Us</a>
        <a href="createaccount.html">Create Account</a>
        <a href="forgotpassword.html">Forgot Password</a>
        <a href="contact.html">Contact Us</a>
        <a href="events.html">Events</a>
        <a href="feedback.html">Feedback</a>
        <a href="login.html">Login</a>
    </nav>
</header>


<main>

    <section class="profile-title">
        <h2>Update Profile</h2>
        <p>Update your personal information</p>
    </section>

    <section class="profile-box">

        <h3>Personal Information</h3>

        <form>

            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name"><br>

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number"><br>

            <label for="enrollment">Enrollment Number</label>
            <input type="text" id="enrollment" name="enrollment" placeholder="Enter enrollment number"><br>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address"><br>

            <button type="submit">Update Profile</button>
            <button type="reset">Reset</button>

        </form>

    </section>

</main>

<footer>

</footer>
    <script src="main.js"></script>
</body>
</html>
